
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Little Surprise 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@500;600&display=swap" rel="stylesheet">

<style>
:root{--pink:#ff4d8d;--deep:#c2185b;--soft:#ffe3ee;--card:rgba(255,255,255,.72)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
font-family:'Poppins',system-ui,sans-serif;
background:linear-gradient(135deg,#ffd6e7 0%,#ffb3d1 45%,#ff8fb8 100%);
color:#4a1030;overflow:hidden;
}

/* floating hearts */
#hearts{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.heart{position:absolute;bottom:-60px;opacity:0;animation:floatUp linear forwards;
filter:drop-shadow(0 2px 4px rgba(194,24,91,.25))}
@keyframes floatUp{
0%{transform:translateY(0) translateX(0) rotate(0);opacity:0}
10%{opacity:.85}
50%{transform:translateY(-55vh) translateX(25px) rotate(15deg)}
100%{transform:translateY(-120vh) translateX(-20px) rotate(-15deg);opacity:0}
}

/* screens */
.screen{
position:fixed;inset:0;z-index:1;display:flex;
padding:20px;overflow-y:auto;
transition:opacity .7s ease,transform .7s ease;
}
.screen.hidden{opacity:0;pointer-events:none;transform:scale(.96)}
.card,#wish .inner{margin:auto}

/* login */
.card{
width:100%;max-width:400px;background:var(--card);
backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,.8);border-radius:28px;
padding:34px 28px 26px;box-shadow:0 20px 50px rgba(194,24,91,.25);
text-align:center;animation:pop .8s cubic-bezier(.2,1.2,.4,1);
}
@keyframes pop{from{transform:scale(.8) translateY(30px);opacity:0}to{transform:none;opacity:1}}
.card .big{font-size:46px;animation:beat 1.2s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
h1{font-family:'Pacifico',cursive;font-weight:400;color:var(--deep);font-size:30px;margin:6px 0 4px}
.sub{font-size:14px;color:#8a3a60;margin-bottom:22px}
.field{text-align:left;margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--deep);margin:0 0 6px 6px;letter-spacing:.5px}
.field input{
width:100%;padding:14px 18px;border-radius:16px;border:2px solid #ffc2da;background:#fff;
font:500 16px 'Poppins',sans-serif;color:#4a1030;outline:none;
transition:border-color .2s,box-shadow .2s;
}
.field input:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(255,77,141,.18)}
.field input::placeholder{color:#d9a1b8}
.error{min-height:20px;font-size:13px;color:#d6003f;font-weight:500;margin:2px 0 6px}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}

.btn-slot{height:54px;display:flex;justify-content:center}
#submitBtn{
padding:14px 38px;border:none;border-radius:50px;cursor:pointer;
font:600 16px 'Poppins',sans-serif;color:#fff;
background:linear-gradient(135deg,#ff5c9a,#e91e63);
box-shadow:0 8px 20px rgba(233,30,99,.4);
white-space:nowrap;touch-action:manipulation;
}
#submitBtn:hover{filter:brightness(1.05)}
#submitBtn.flying{
position:fixed;z-index:50;
transition:left .35s cubic-bezier(.3,1.4,.5,1),top .35s cubic-bezier(.3,1.4,.5,1);
}
.tease{min-height:22px;margin-top:12px;font-size:13.5px;color:var(--deep);font-weight:500}

/* birthday page */
#wish{flex-direction:column;text-align:center}
#wish .inner{max-width:560px;width:100%}
.cake{font-size:80px;animation:bounce 1.6s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.hb{font-family:'Pacifico',cursive;font-size:clamp(34px,9vw,56px);color:var(--deep);line-height:1.2;margin:8px 0;
text-shadow:0 4px 14px rgba(255,255,255,.7)}
.who{font-size:clamp(26px,7vw,40px);font-family:'Pacifico',cursive;color:#fff;
text-shadow:0 3px 10px rgba(194,24,91,.5);margin-bottom:16px;word-break:break-word}
.msg{
background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
border-radius:22px;padding:22px;font-size:16px;line-height:1.75;color:#5a1a3a;
box-shadow:0 14px 36px rgba(194,24,91,.22);min-height:200px;white-space:pre-line;
}
.caret{display:inline-block;width:2px;height:1em;background:var(--deep);margin-left:2px;vertical-align:-2px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
.more{
margin-top:20px;padding:13px 30px;border:none;border-radius:50px;cursor:pointer;
font:600 15px 'Poppins',sans-serif;color:#fff;background:linear-gradient(135deg,#ff5c9a,#e91e63);
box-shadow:0 8px 20px rgba(233,30,99,.4);
}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:5}

/* surprise: heart photo + poem */
#surprise{
position:fixed;inset:0;z-index:20;display:flex;
background:rgba(74,16,48,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
padding:20px;overflow-y:auto;
opacity:0;pointer-events:none;transition:opacity .5s;
}
#surprise.show{opacity:1;pointer-events:auto}
.sbox{margin:auto;text-align:center;width:100%;max-width:380px}
.heart-wrap{
position:relative;width:min(78vw,300px);aspect-ratio:1/.92;margin:0 auto;
transform:scale(0) rotate(-20deg);
}
#surprise.show .heart-wrap{animation:heartOpen 1.1s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes heartOpen{
0%{transform:scale(0) rotate(-20deg)}
60%{transform:scale(1.12) rotate(4deg)}
100%{transform:scale(1) rotate(0)}
}
.heart-shadow{position:absolute;inset:0;filter:drop-shadow(0 12px 20px rgba(194,24,91,.5))}
.heart-bg,.heart-photo{
position:absolute;
clip-path:url(#heartClip);
-webkit-clip-path:url(#heartClip);
}
.heart-bg{inset:0;background:linear-gradient(135deg,#ff5c9a,#e91e63)}
.heart-photo{
inset:7px;
object-fit:cover;
width:calc(100% - 14px);
height:calc(100% - 14px);
background:#ffd6e7;
display:block;
}
.poem{
margin-top:22px;background:var(--card);border-radius:22px;padding:20px 18px;
font-family:'Noto Sans Tamil','Poppins',sans-serif;font-weight:500;
font-size:16px;line-height:1.9;color:#5a1a3a;white-space:pre-line;
box-shadow:0 14px 36px rgba(194,24,91,.25);
opacity:0;transform:translateY(20px);
}
#surprise.show .poem{animation:poemIn .9s .9s ease forwards}
@keyframes poemIn{to{opacity:1;transform:none}}
.close{
margin-top:18px;padding:11px 28px;border:none;border-radius:50px;cursor:pointer;
font:600 14px 'Poppins',sans-serif;color:var(--deep);background:#fff;
}
</style>
</head>

<body>

<div id="hearts"></div>
<canvas id="confetti"></canvas>

<!-- heart shape for photo -->
<svg width="0" height="0" style="position:absolute">
<clipPath id="heartClip" clipPathUnits="objectBoundingBox">
<path d="M0.5,0.95 C0.1,0.65 0,0.4 0,0.28 C0,0.1 0.12,0 0.27,0 C0.38,0 0.46,0.06 0.5,0.14 C0.54,0.06 0.62,0 0.73,0 C0.88,0 1,0.1 1,0.28 C1,0.4 0.9,0.65 0.5,0.95 Z"/>
</clipPath>
</svg>

<!-- LOGIN PAGE -->
<section id="login" class="screen">
<form class="card" id="form" autocomplete="off" novalidate>

<div class="big">💖</div>
<h1>Hey, you!</h1>
<p class="sub">Unakaga oru chinna surprise irukku 🎁<br>Name &amp; password pottu thirakkanum</p>

<div class="field">
<label for="name">YOUR NAME</label>
<input id="name" type="text" placeholder="Un name enna?" maxlength="30">
</div>

<div class="field">
<label for="pass">PASSWORD (hint: your birthday 😉)</label>
<input id="pass" type="text" inputmode="numeric" placeholder="DD-MM-YYYY" maxlength="10">
</div>

<div class="error" id="error"></div>

<div class="btn-slot" id="slot">
<button type="submit" form="form" id="submitBtn">Open 💌</button>
</div>
<div class="tease" id="tease"></div>

</form>
</section>

<!-- BIRTHDAY PAGE -->
<section id="wish" class="screen hidden">
<div class="inner">
<div class="cake">🎂</div>
<div class="hb">Happy Birthday!</div>
<div class="who" id="who"></div>

<div class="msg">
<span id="typed"></span><span class="caret"></span>
</div>

<button class="more" id="moreBtn">Surprise me more 💖</button>
</div>
</section>

<!-- SURPRISE PAGE -->
<div id="surprise">
<div class="sbox">

<div class="heart-wrap">
<div class="heart-shadow">
<div class="heart-bg"></div>
</div>

<!-- PHOTO FILE -->
<img class="heart-photo" src="./photo1.jpg" alt="Birthday Photo">

</div>

<div class="poem">நட்பு என்பது வெறும் சொல் அல்ல,
நெஞ்சில் பூக்கும் உயிர்ப் பூ!
சிரிப்பில் கை கோர்த்து,
துயரில் தோள் கொடுத்து,
என்றும் உடன் வரும் உறவு இது.
நீ இருந்தால் போதும்,
நாட்கள் எல்லாம் திருநாளே! 💖</div>

<button class="close" id="closeBtn">Close 💌</button>

</div>
</div>

<script>

/* EDIT HERE */
const PASSWORD_DOB = "05112006";

const MESSAGE =
`Indha naal unakku romba special day! 🎉
Nee eppavume ippadiye sirichukitte, happy ah irukkanum.
Un life la ellaa nalla vishayam um unna thedi varanum 💕
Once again, many many happy returns of the day! 🥳`;

const TEASES = [
"Miss aaiduchu 😜",
"Innum onnu try pannu 😏",
"Konjam kooda ... 🙈",
"Ok ok, ippo pidichuko! 💖"
];

const $ = id => document.getElementById(id);

const form = $('form'), nameEl = $('name'), passEl = $('pass'),
errEl = $('error'), btn = $('submitBtn'), tease = $('tease');

/* floating hearts */
const heartChars = ['💖','💕','💗','💓','❤️','🩷','💘'];

function spawnHeart(){
const h = document.createElement('span');
h.className = 'heart';
h.textContent = heartChars[Math.floor(Math.random()*heartChars.length)];
h.style.left = Math.random()*100 + 'vw';
h.style.fontSize = (14 + Math.random()*30) + 'px';
const dur = 7 + Math.random()*8;
h.style.animationDuration = dur + 's';
$('hearts').appendChild(h);
setTimeout(()=>h.remove(), dur*1000 + 200);
}

for(let i=0;i<18;i++) setTimeout(spawnHeart, i*180);
setInterval(spawnHeart, 450);

/* auto-format DD-MM-YYYY */
passEl.addEventListener('input', () => {
let d = passEl.value.replace(/\D/g,'').slice(0,8);
let out = d;
if(d.length > 4) out = d.slice(0,2)+'-'+d.slice(2,4)+'-'+d.slice(4);
else if(d.length > 2) out = d.slice(0,2)+'-'+d.slice(2);
passEl.value = out;
errEl.textContent = '';
});

nameEl.addEventListener('input', () => errEl.textContent = '');

/* validation */
function showError(msg){
errEl.textContent = msg;
form.classList.remove('shake');
void form.offsetWidth;
form.classList.add('shake');
}

function valid(){
const name = nameEl.value.trim();
const pass = passEl.value.replace(/\D/g,'');

if(!name){
showError('Un name ah type pannu first 🥺');
nameEl.focus();
return false;
}

if(pass !== PASSWORD_DOB){
showError('Password thappu 🙈 — un birthday date podu!');
passEl.focus();
return false;
}

return true;
}

/* running button */
let dodges = 0, lastDodge = 0;

function dodge(){
const now = Date.now();
if(now - lastDodge < 400) return;
lastDodge = now;

const r = btn.getBoundingClientRect();

if(!btn.classList.contains('flying')){
document.body.appendChild(btn);
btn.style.width = r.width + 'px';
btn.style.left = r.left + 'px';
btn.style.top = r.top + 'px';
btn.classList.add('flying');
void btn.offsetWidth;
}

const pad = 14;
const maxX = window.innerWidth - r.width - pad;
const maxY = window.innerHeight - r.height - pad;

let x,y,tries = 0;

do{
x = pad + Math.random()*Math.max(1,maxX-pad);
y = pad + Math.random()*Math.max(1,maxY-pad);
tries++;
}while(Math.hypot(x-r.left,y-r.top)<130 && tries<25);

btn.style.left = x + 'px';
btn.style.top = y + 'px';

dodges++;
tease.textContent = TEASES[dodges-1];
}

function tryDodge(e){
if(dodges >= 3){
tease.textContent = TEASES[3];
return;
}

if(!valid()){
if(e.cancelable) e.preventDefault();
return;
}

if(e.cancelable) e.preventDefault();
dodge();
}

btn.addEventListener('pointerenter', e => {
if(e.pointerType === 'mouse') tryDodge(e);
});

btn.addEventListener('pointerdown', e => {
if(e.pointerType !== 'mouse') tryDodge(e);
});

form.addEventListener('submit', e => {
e.preventDefault();
if(!valid()) return;
if(dodges < 3){ dodge(); return; }
openWish();
});

/* open birthday page */
let opened = false;

function openWish(){
if(opened) return;
opened = true;

$('who').textContent = '💖 ' + nameEl.value.trim() + ' 💖';
$('login').classList.add('hidden');
btn.style.display = 'none';

setTimeout(()=>{
$('wish').classList.remove('hidden');
startConfetti();
typeMessage();
},450);

for(let i=0;i<25;i++) setTimeout(spawnHeart,i*80);
}

function typeMessage(){
const el = $('typed');
let i = 0;

(function tick(){
if(i <= MESSAGE.length){
el.textContent = MESSAGE.slice(0,i++);
setTimeout(tick,38);
}
})();
}

/* confetti */
const cv = $('confetti'), cx = cv.getContext('2d');

function resize(){
cv.width = innerWidth;
cv.height = innerHeight;
}

resize();
addEventListener('resize',resize);

let parts = [], running = false;

const colors = ['#ff4d8d','#ffd54f','#ffffff','#ff80ab','#b388ff','#80d8ff','#ffab40'];

function burst(n,x,y){
for(let i=0;i<n;i++){
parts.push({
x:x ?? Math.random()*cv.width,
y:y ?? -10,
vx:(Math.random()-.5)*(y===undefined?4:12),
vy:y===undefined?2+Math.random()*4:-(4+Math.random()*10),
s:5+Math.random()*7,
c:colors[Math.floor(Math.random()*colors.length)],
r:Math.random()*6,
vr:(Math.random()-.5)*.3,
life:0
});
}

if(!running){
running = true;
loop();
}
}

function loop(){
cx.clearRect(0,0,cv.width,cv.height);

parts.forEach(p=>{
p.x += p.vx;
p.y += p.vy;
p.vy += .12;
p.r += p.vr;
p.life++;

cx.save();
cx.translate(p.x,p.y);
cx.rotate(p.r);
cx.fillStyle = p.c;
cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
cx.restore();
});

parts = parts.filter(p=>p.y<cv.height+20 && p.life<400);

if(parts.length){
requestAnimationFrame(loop);
}else{
running = false;
cx.clearRect(0,0,cv.width,cv.height);
}
}

function startConfetti(){
let n = 0;
const t = setInterval(()=>{
burst(18);
if(++n > 12) clearInterval(t);
},300);
}

/* surprise button */
$('moreBtn').addEventListener('click',e=>{
burst(80,e.clientX,e.clientY);

for(let i=0;i<14;i++){
setTimeout(spawnHeart,i*60);
}

$('surprise').classList.add('show');
});

$('closeBtn').addEventListener('click',()=>{
$('surprise').classList.remove('show');
});

</script>
</body>
</html>
